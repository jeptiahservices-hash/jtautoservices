<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
        authDomain: "jtautoservices-metadata.firebaseapp.com",
        databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jtautoservices-metadata",
        storageBucket: "jtautoservices-metadata.firebasestorage.app",
        messagingSenderId: "426427161628",
        appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.checkService = function() {
        const input = document.getElementById('regInput').value.trim().toUpperCase();
        const resultDiv = document.getElementById('reportResult');
        
        if (!input) return alert("Please enter a plate number");

        // Show a simple loading state
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = "<p style='text-align:center;'>Searching database...</p>";

        // Direct path to the specific car record
        const recordRef = ref(db, `serviceRecords/${input}`);

        get(recordRef).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Build Parts List HTML (Safe check)
                let partsHTML = '';
                if (data.partsChanged && Array.isArray(data.partsChanged)) {
                    data.partsChanged.forEach(item => {
                        partsHTML += `<li>${item}</li>`;
                    });
                } else {
                    partsHTML = "<li>No specific parts listed</li>";
                }

                resultDiv.innerHTML = `
                    <div class="report-card">
                        <img src="${data.carImage || 'https://via.placeholder.com/600x250?text=No+Photo'}" class="car-photo" alt="Car Photo">
                        <div class="content">
                            <h2 style="margin:0">${input}</h2>
                            <p style="color:var(--text-dim)">Customer Name: ${data.customerName || 'N/A'}</p>
                            <p style="color:var(--text-dim)">Model: ${data.cardetails || 'N/A'}</p>
                            
                            <span class="section-title">Service Summary</span>
                            <p><strong>Date:</strong> ${data.lastService || 'N/A'} | <strong>Mileage:</strong> ${data.mileage || 'N/A'}</p>
                            
                            <span class="section-title">Items Replaced</span>
                            <ul class="parts-list">${partsHTML}</ul>

                            <span class="section-title">Additional Remarks</span>
                            <p>${data.details || 'No additional remarks.'}</p>

                            <a href="${data.driveLink}" target="_blank" class="pdf-btn">📄 View Full PDF Invoice</a>
                            
                            <p style="margin-top:20px; color:#ffca28; font-size:1.1rem; font-weight:bold;">
                                📅 Next Service: ${data.nextService || 'Check with Workshop'}
                            </p>
                        </div>
                    </div>
                `;
            } else {
                resultDiv.style.display = 'none';
                alert("No record found for: " + input);
            }
        }).catch((error) => {
            console.error(error);
            alert("Error connecting to database. Please check your connection.");
        });
    }
</script>
