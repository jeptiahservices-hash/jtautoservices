<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Your Firebase Config (Keep this exactly as your other pages)
    const firebaseConfig = {
        apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
        authDomain: "jtautoservices-metadata.firebaseapp.com",
        databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jtautoservices-metadata",
        storageBucket: "jtautoservices-metadata.firebasestorage.app",
        messagingSenderId: "426427161628",
        appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Make the function global so the button can see it
    window.checkService = function() {
        const input = document.getElementById('regInput').value.trim().toUpperCase();
        const resultDiv = document.getElementById('reportResult');
        
        if (!input) return alert("Please enter a plate number");

        // Reference to the specific plate in Firebase
        const dbRef = ref(db);
        get(child(dbRef, `serviceRecords/${input}`)).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Build Parts List HTML
                let partsHTML = '';
                if(data.partsChanged) {
                    data.partsChanged.forEach(item => {
                        partsHTML += `<li>${item}</li>`;
                    });
                }

                resultDiv.innerHTML = `
                    <div class="report-card">
                        <img src="${data.carImage || 'https://via.placeholder.com/600x250?text=No+Photo'}" class="car-photo" alt="Car Photo">
                        <div class="content">
                            <h2 style="margin:0">${input}</h2>
                            <p style="color:var(--text-dim)">Customer Name: ${data.customerName}</p>
                            <p style="color:var(--text-dim)">Car Brands / Model: ${data.cardetails}</p>
                            
                            <span class="section-title">Summary</span>
                            <p><strong>Date:</strong> ${data.lastService} | <strong>Mileage:</strong> ${data.mileage}</p>
                            
                            <span class="section-title">Items Replaced</span>
                            <ul class="parts-list">${partsHTML}</ul>

                            <span class="section-title">Additional Remarks</span>
                            <p>${data.details}</p>

                            <a href="${data.driveLink}" target="_blank" class="pdf-btn">📄 View Full PDF Invoice</a>
                            
                            <p style="margin-top:20px; color:#ffca28; font-size:0.9rem;">
                                Next Service: ${data.nextService}
                            </p>
                        </div>
                    </div>
                `;
                resultDiv.style.display = 'block';
            } else {
                resultDiv.style.display = 'none';
                alert("No record found for: " + input);
            }
        }).catch((error) => {
            console.error(error);
            alert("Error fetching records.");
        });
    }
</script>
