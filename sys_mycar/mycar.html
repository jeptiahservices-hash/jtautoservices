<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JT Auto Services | Comprehensive Report</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-blue: #58a6ff;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --success: #2ea44f;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .company-logo {
            width: 220px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 1.5rem;
        }

        .logo { font-size: 1.8rem; font-weight: bold; color: var(--accent-blue); margin-bottom: 20px; }

        .search-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }

        input {
            width: 70%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            text-transform: uppercase;
        }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #reportResult { width: 100%; max-width: 700px; display: none; }

        .report-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .car-photo {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 4px solid var(--accent-blue);
        }

        .content { padding: 25px; }

        .section-title {
            color: var(--accent-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            display: block;
        }

        .parts-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .parts-list li {
            background: #0d1117;
            margin-bottom: 5px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            border-left: 3px solid var(--success);
        }

        .pdf-btn {
            display: inline-block;
            margin-top: 20px;
            background: #238636;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <img src="logo.png" alt="Company Logo" class="company-logo">
    <div class="logo">MyCar -Aftersales Service-</div>

    <div class="search-container">
        <input type="text" id="regInput" placeholder="ENTER PLATE NUMBER">
        <button onclick="checkService()">SEARCH RECORDS</button>
    </div>

    <div id="reportResult">
        </div>

    <script src="data.js"></script>

    <script>
        function checkService() {
            const input = document.getElementById('regInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('reportResult');
            
            if (serviceRecords[input]) {
                const data = serviceRecords[input];
                
                // Build Parts List HTML
                let partsHTML = '';
                data.partsChanged.forEach(item => {
                    partsHTML += `<li>${item}</li>`;
                });

                resultDiv.innerHTML = `
                    <div class="report-card">
                        <img src="${data.carImage}" class="car-photo" alt="Car Photo">
                        <div class="content">
                            <h2 style="margin:0">${input}</h2>
                            <p style="color:var(--text-dim)">Customer: ${data.customerName}</p>
                            
                            <span class="section-title">Summary</span>
                            <p><strong>Date:</strong> ${data.lastService} | <strong>Mileage:</strong> ${data.mileage}</p>
                            
                            <span class="section-title">Items Replaced</span>
                            <ul class="parts-list">${partsHTML}</ul>

                            <span class="section-title">Additional Remarks</span>
                            <p>${data.details}</p>

                            <a href="${data.driveLink}" target="_blank" class="pdf-btn">📄 View Full PDF Invoice</a>
                            
                            <p style="margin-top:20px; color:#ffca28; font-size:0.9rem;">
                                Next Service: ${data.nextService}
                            </p>
                        </div>
                    </div>
                `;
                resultDiv.style.display = 'block';
            } else {
                alert("No record found.");
            }
        }
    </script>
</body>
</html>
