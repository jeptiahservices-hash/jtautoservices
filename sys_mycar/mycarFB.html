<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JT Auto Services | Comprehensive Customer Portal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-blue: #58a6ff;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --success: #2ea44f;
            --warning: #fbbf24;
            --danger: #ff4d4d;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin:0;
        }
        /* WHITE LOGO DESIGN FOR THE DARK SCREEN MODE */
        .company-logo { width: 180px; height: auto; margin-bottom: 10px; object-fit: contain; }
        
        .search-container {
            background: var(--card-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px;
            text-align: center; border: 1px solid #30363d; margin-bottom: 20px; box-sizing: border-box;
        }
        input {
            width: 60%; padding: 12px; border-radius: 6px; border: 1px solid #30363d;
            background: #0d1117; color: #fff; text-transform: uppercase; font-size: 1rem;
        }
        button {
            background: var(--accent-blue); color: #0b0e14; border: none; padding: 12px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem;
        }
        #reportResult { width: 100%; max-width: 700px; display: none; margin-bottom: 25px; }
        .report-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
        .car-photo { width: 100%; height: 260px; object-fit: cover; border-bottom: 4px solid var(--accent-blue); }
        .content { padding: 25px; }
        .section-title {
            color: var(--accent-blue); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
            margin-top: 20px; display: block; font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 5px;
        }
        .ledger-table { width:100%; margin-top:10px; border-collapse:collapse; font-size:0.95rem; }
        .ledger-table th, .ledger-table td { padding:8px; border-bottom:1px solid #30363d; text-align:left; }
        
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; margin-top: 5px; }
        .badge-paid { background: rgba(46, 164, 79, 0.2); color: #56d364; border: 1px solid var(--success); }
        .badge-debt { background: rgba(255, 77, 77, 0.2); color: #ff7b72; border: 1px solid var(--danger); }

        .pdf-btn {
            display: block; margin-top: 25px; background: var(--success); color: white;
            text-decoration: none; padding: 15px 20px; border-radius: 6px; font-weight: bold; text-align: center; cursor:pointer; width: 100%; border: none; font-size: 1rem;
        }
        
        /* HIDDEN PRINT PANE */
        #invoice-print-pane { display: none; background: white; color: #333; padding: 40px; }
        
        @media print {
            .no-print-area { display: none !important; }
            #invoice-print-pane { display: block !important; }
            body { background: white; color: #333; padding: 0; }
        }
    </style>
</head>
<body>
    
    <div class="no-print-area" style="text-align:center; width:100%;">
        <!-- USE WHITE LOGO HERE FOR DARK SYSTEM THEME SCREEN VISUALS -->
        <img src="logo.png" alt="JT Auto Services" class="company-logo" onerror="this.src='https://via.placeholder.com/180x80?text=JTS+White+Logo'">
        <div style="font-size: 1.6rem; font-weight: bold; color: var(--accent-blue); margin-bottom: 20px;">
            MyCar <span style="color:var(--text-main); font-weight: normal; font-size: 1.1rem;">- Aftersales Service Tracking -</span>
        </div>

        <div class="search-container" style="margin: 0 auto 20px auto;">
            <input type="text" id="regInput" placeholder="PLATE NUMBER">
            <button onclick="checkService()">SEARCH</button>
        </div>
    </div>

    <div id="reportResult" class="no-print-area"></div>
    <div id="invoice-print-pane"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
            authDomain: "jtautoservices-metadata.firebaseapp.com",
            databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "jtautoservices-metadata",
            storageBucket: "jtautoservices-metadata.firebasestorage.app",
            messagingSenderId: "426427161628",
            appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentRecordData = null;
        let currentPlate = "";

        window.checkService = async function() {
            currentPlate = document.getElementById('regInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('reportResult');
            if (!currentPlate) return alert("Please type your plate number");

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = "<p style='color:var(--text-dim); text-align:center;'>Fetching secure workshop node logs...</p>";

            try {
                const snapshot = await get(ref(db, `serviceRecords/${currentPlate}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    currentRecordData = data;
                    
                    let rowsHTML = (data.invoiceItems || []).map(i => `
                        <tr>
                            <td><strong>${i.item}</strong>${i.specification ? `<br><small style="color:var(--text-dim);">${i.specification}</small>` : ''}</td>
                            <td>${i.quantity}</td>
                            <td>RM ${parseFloat(i.rate).toFixed(2)}</td>
                        </tr>
                    `).join('');

                    const fin = data.financials || { totalDebitAmount: 0, depositCreditAmount: 0, outstandingBalanceDue: 0, paymentMethodUsed: "N/A" };
                    
                    const isFullyPaid = parseFloat(fin.outstandingBalanceDue) <= 0;
                    const statusBadgeHTML = isFullyPaid 
                        ? `<span class="status-badge badge-paid">✓ FULLY PAID (LUNAS)</span>`
                        : `<span class="status-badge badge-debt">⚠️ BALANCE OUTSTANDING</span>`;

                    resultDiv.innerHTML = `
                        <div class="report-card">
                            <img src="${data.carImage || 'https://via.placeholder.com/600x300?text=Vehicle+Photo+Active'}" class="car-photo">
                            <div class="content">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                    <div>
                                        <h2 style="margin:0; color:var(--accent-blue);">${currentPlate}</h2>
                                        <p style="margin:5px 0; font-weight:bold;">Owner: ${data.customerName || 'Private Customer'}</p>
                                    </div>
                                    <div>${statusBadgeHTML}</div>
                                </div>
                                <p style="margin:0; color:var(--text-dim);">Model: ${data.cardetails || 'N/A'} | Mileage: ${data.mileage || 'N/A'}</p>
                                
                                <span class="section-title">Diagnostics Breakdown</span>
                                <table class="ledger-table">
                                    <thead><tr style="color:var(--text-dim);"><th>Item Work</th><th>Qty</th><th>Price</th></tr></thead>
                                    <tbody>${rowsHTML || '<tr><td colspan="3">Standard Maintenance Visit Logged</td></tr>'}</tbody>
                                </table>

                                <span class="section-title">Statement Ledger Accounts</span>
                                <div style="background:#0d1117; padding:15px; border-radius:6px; margin-top:10px; line-height:1.6;">
                                    <div>Total Bill Cost: <strong>RM ${parseFloat(fin.totalDebitAmount).toFixed(2)}</strong></div>
                                    <div style="color:var(--warning);">Amount Paid (Credit): <strong>- RM ${parseFloat(fin.depositCreditAmount).toFixed(2)}</strong></div>
                                    <div style="border-top:1px solid #30363d; margin-top:5px; padding-top:5px; color:${isFullyPaid ? '#56d364' : '#ff7b72'}">
                                        Remaining Balance Due: <strong>RM ${parseFloat(fin.outstandingBalanceDue).toFixed(2)}</strong>
                                    </div>
                                </div>

                                <div style="margin-top:20px; background: rgba(251, 191, 36, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(251, 191, 36, 0.3); text-align:center;">
                                    <span style="color:#fbbf24; font-weight:bold;">📅 NEXT SUGGESTED VISIT: ${data.nextService || 'Contact Shop'}</span>
                                </div>

                                <button class="pdf-btn" onclick="generateInvoicePDF()">📄 DOWNLOAD OFFICIAL INVOICE PDF</button>
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.style.display = 'none';
                    alert("No data entry matches that plate registration number.");
                }
            } catch (err) {
                alert("Connection failed: " + err.message);
            }
        };

        window.generateInvoicePDF = function() {
            if(!currentRecordData) return;
            const d = currentRecordData;
            const fin = d.financials || { totalDebitAmount: 0, depositCreditAmount: 0, outstandingBalanceDue: 0, paymentMethodUsed: "Cash" };
            const isFullyPaid = parseFloat(fin.outstandingBalanceDue) <= 0;

            const rows = (d.invoiceItems || []).map(i => `
                <tr>
                    <td style="border:1px solid #ddd; padding:8px;"><strong>${i.item}</strong>${i.specification ? `<br><small style="color:#666;">${i.specification}</small>` : ''}</td>
                    <td style="border:1px solid #ddd; padding:8px; text-align:center;">${i.quantity}</td>
                    <td style="border:1px solid #ddd; padding:8px; text-align:right;">${parseFloat(i.rate).toFixed(2)}</td>
                    <td style="border:1px solid #ddd; padding:8px; text-align:right;">${(i.quantity * i.rate).toFixed(2)}</td>
                </tr>
            `).join('');

            // PRINT INVOICE GENERATOR WITH BLACK LOGO FOR CLEAR PRINT ON WHITE PAPER
            document.getElementById('invoice-print-pane').innerHTML = `
                <div style="font-family:sans-serif; color:#333;">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #333; padding-bottom:15px;">
                        <div style="display:flex; align-items:center; gap:15px;">
                            <!-- SWITCHED HERE TO BLACK LOGO (logob.png) FOR PRINTING -->
                            <img src="images/logob.png" style="max-height:85px; width:auto;" alt="Logo" onerror="this.src='https://via.placeholder.com/180x80?text=JTS+Black+Logo'">
                            <div>
                                <h2 style="margin:0; color:#1a1a1a;">JT Auto Services</h2>
                                <p style="font-size:12px; color:#555; margin:2px 0 0 0; line-height:1.4;">
                                    Reg SSM: 202503349561 (JR0185602-T)<br>
                                    Lot 277E, Kampung Semarang BT30, 43800 Dengkil, Selangor<br>
                                    Tel: 016-5250890
                                </p>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <h2 style="margin:0; color:#007bff; font-size:1.8em;">RECEIPT</h2>
                            <p style="margin:4px 0 0 0; font-size:13px;"><strong>No Plate:</strong> ${currentPlate}</p>
                            <p style="margin:2px 0 0 0; font-size:13px;"><strong>Tarikh:</strong> ${d.lastService || '-'}</p>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin:20px 0; font-size:14px; border:1px solid #eee; padding:12px; border-radius:6px;">
                        <div>
                            <strong>BILL TO:</strong><br>
                            Nama: ${d.customerName || 'Private'}<br>
                            Tel: ${d.custPhone || '-'}
                        </div>
                        <div style="text-align:right;">
                            <strong>VEHICLE DETAILS:</strong><br>
                            Model: ${d.cardetails || 'N/A'}<br>
                            Mileage: ${d.mileage || 'N/A'}
                        </div>
                    </div>

                    <table style="width:100%; border-collapse:collapse; font-size:14px;">
                        <thead><tr style="background:#f8f9fa;">
                            <th style="border:1px solid #ddd; padding:10px; text-align:left;">Description</th>
                            <th style="border:1px solid #ddd; padding:10px; text-align:center;" width="10%">Qty</th>
                            <th style="border:1px solid #ddd; padding:10px; text-align:right;" width="20%">Unit (RM)</th>
                            <th style="border:1px solid #ddd; padding:10px; text-align:right;" width="20%">Total (RM)</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>

                    <div style="margin-top:20px; text-align:right; font-size:14px; line-height:1.6;">
                        <div>Jumlah Kasar (Subtotal): <strong>RM ${parseFloat(fin.totalDebitAmount).toFixed(2)}</strong></div>
                        <div>Jumlah Telah Dibayar (Paid): <strong>RM ${parseFloat(fin.depositCreditAmount).toFixed(2)}</strong></div>
                        <div style="border-top:1px solid #333; margin-top:5px; padding-top:5px; font-size:16px;">
                            ${isFullyPaid 
                                ? `<strong style="color:green; font-size: 1.2rem;">✓ PAID IN FULL (LUNAS)</strong>` 
                                : `Baki Akhir (Balance Due): <strong style="color:red;">RM ${parseFloat(fin.outstandingBalanceDue).toFixed(2)}</strong>`}
                        </div>
                    </div>

                    ${d.signatures && d.signatures.mechanicToken ? `
                        <div style="margin-top:40px; display:flex; justify-content:flex-end;">
                            <div style="text-align:center; width:200px;">
                                <img src="${d.signatures.mechanicToken}" style="max-height:60px; display:block; margin:0 auto;">
                                <div style="border-top:1px solid #333; margin-top:5px; font-size:12px; padding-top:4px;">Authorized Agent Signature</div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            window.print();
        };
    </script>
</body>
</html>
