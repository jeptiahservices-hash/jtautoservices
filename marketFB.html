<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTS Market | Genuine Parts</title>
    <style>
        /* Floating Basket Button */
.basket-fab {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--primary-color);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 2500;
    transition: transform 0.2s;
}
.basket-fab:active { transform: scale(0.9); }
.basket-count {
    position: absolute;
    top: 0;
    right: 0;
    background: #ff4444;
    color: white;
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: bold;
}

/* Full Screen Basket Overlay */
#basketModal {
    display: none;
    position: fixed;
    z-index: 4000;
    left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
}

.basket-content {
    background: var(--card-bg);
    margin: 50px auto;
    width: 90%;
    max-width: 450px;
    border-radius: 15px;
    padding: 20px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
}

.basket-items-list {
    overflow-y: auto;
    flex-grow: 1;
    margin: 15px 0;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 10px 0;
    border-bottom: 1px solid #374151;
}

.cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }

.cart-item-info { flex-grow: 1; }
.cart-item-info h4 { margin: 0; font-size: 0.9rem; }
.cart-item-info p { margin: 0; color: var(--primary-color); font-weight: bold; }

.remove-item { color: #ff4444; cursor: pointer; font-size: 1.2rem; margin-left: 10px; }

/* Hide the old bottom bar if you want, or keep it for the total */
.basket-bar { display: none !important; }
        
        :root {
            --primary-color: #2563eb;
            --dark-bg: #111827;
            --card-bg: #1f2937;
            --text-light: #f3f4f6;
            --accent-gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* --- HEADER & HERO --- */
        header {
            background: rgba(17, 24, 39, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-color);
        }
        .logo-container img { height: 120px; vertical-align: middle; }
        .logo-text { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .lang-switch button {
            background: transparent; border: 1px solid #444; color: white;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
        }

        .hero {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('images/img_hero_wallpaper.jpeg');
            background-size: cover;
            background-position: center;
        }

        /* --- SEARCH & NAV --- */
        .search-container {
            padding: 20px 5%;
            position: sticky;
            top: 70px;
            background: var(--dark-bg);
            z-index: 900;
        }
        #productSearch {
            width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #333;
            background: var(--card-bg); color: white; font-size: 1rem; box-sizing: border-box;
        }

        .category-nav {
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 5%;
            background: #1a222f; position: sticky; top: 135px; z-index: 850; border-bottom: 1px solid #333;
        }
        .category-nav a {
            background: var(--card-bg); color: white; padding: 8px 15px; border-radius: 20px;
            text-decoration: none; white-space: nowrap; font-size: 0.8rem; border: 1px solid #444;
        }

        /* --- MARKET GRID --- */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .market-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .market-grid { grid-template-columns: repeat(2, 1fr); } }

        .product-card {
            background: var(--card-bg); border-radius: 12px; padding: 15px;
            text-align: center; border: 1px solid #333; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--primary-color); }
        .product-card img { width: 100%; height: 120px; object-fit: contain; margin-bottom: 10px; }
        .brand-label { font-size: 0.6rem; color: var(--primary-color); font-weight: 800; text-transform: uppercase; }
        .fit-badge { font-size: 0.6rem; background: #374151; color: var(--accent-gold); padding: 2px 6px; border-radius: 4px; }
        .price { color: var(--primary-color); font-weight: bold; display: block; margin: 10px 0; }

        /* --- MODAL POPUP --- */
        .modal {
            display: none; position: fixed; z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); margin: 5% auto; padding: 20px;
            width: 90%; max-width: 500px; border-radius: 15px;
            border: 1px solid var(--primary-color); position: relative;
            max-height: 80vh; overflow-y: auto;
        }
        .close-modal { position: absolute; right: 20px; top: 10px; font-size: 30px; cursor: pointer; color: #ff4444; }
        .modal-gallery { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; padding-bottom: 10px; }
        .modal-gallery img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #444; flex-shrink: 0; }

        /* --- BASKET & BUTTONS --- */
        .qty-controls { display: flex; justify-content: center; align-items: center; gap: 10px; background: #111827; border-radius: 6px; padding: 5px; }
        .qty-btn { background: var(--primary-color); color: white; border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; }
        .qty-input { width: 30px; text-align: center; background: transparent; color: white; border: none; font-weight: bold; }
        
        .basket-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-top: 3px solid var(--primary-color); z-index: 2000;
        }
        .checkout-btn { background: #25d366; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }

        .shopee-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #ee4d2d; /* Shopee's official orange */
    color: white !important;
    padding: 12px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 20px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    border: none;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.shopee-btn:hover {
    background-color: #ff5722;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}

.shopee-btn:active {
    transform: translateY(0);
}
        @keyframes pulse-orange {
    0% { box-shadow: 0 0 0 0 rgba(238, 77, 45, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(238, 77, 45, 0); }
    100% { box-shadow: 0 0 0 0 rgba(238, 77, 45, 0); }
}

.shopee-btn {
    animation: pulse-orange 2s infinite;
}
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
            <span class="logo-text">Mar<span style="color:var(--primary-color)">ket</span></span>
        </div>
        <div class="nav-right">
            <div class="lang-switch">
                <button onclick="setLanguage('en')">EN</button>
                <button onclick="setLanguage('bm')">BM</button>
            </div>
            <a href="index.html" class="logo-text" style="font-size: 0.7rem; border-left: 1px solid #333; padding-left: 10px;">HOME</a>
        </div>
    </header>

    <section class="hero">
        <h1 data-en="Shop Parts" data-bm="Kedai Alat Ganti">Shop Parts</h1>
        <p data-en="Select items and checkout via WhatsApp" data-bm="Pilih barang dan pesan melalui WhatsApp">Select items and checkout via WhatsApp</p>
    </section>

    <div class="search-container">
        <input type="text" id="productSearch" onkeyup="filterProducts()" placeholder="Search model or part...">
    </div>

    <div class="category-nav">
        <a href="#oil-section">🛢️ Engine Oil</a>
        <a href="#filter-section">🌪️ Oil Filters</a>
        <a href="#bulb-section">💡 Bulbs</a>
    </div>

    <div id="market-content" style="padding: 20px 5%;">
        <div id="oil-section" style="margin-bottom: 40px;">
            <h3 style="border-left: 4px solid var(--primary-color); padding-left: 10px;" data-en="Engine Oil" data-bm="Minyak Enjin">Engine Oil</h3>
            <div class="market-grid"></div> 
        </div>

        <div id="filter-section" style="margin-bottom: 40px;">
            <h3 style="border-left: 4px solid var(--primary-color); padding-left: 10px;" data-en="Oil Filters" data-bm="Penapis Minyak">Oil Filters</h3>
            <div class="market-grid"></div>
        </div>

        <div id="bulb-section" style="margin-bottom: 40px;">
            <h3 style="border-left: 4px solid var(--primary-color); padding-left: 10px;" data-en="Bulbs & Lights" data-bm="Lampu & Mentol">Bulbs & Lights</h3>
            <div class="market-grid"></div>
        </div>
    </div>

    <!-- Floating Action Button -->
<div class="basket-fab" onclick="toggleBasket()">
    <span style="font-size: 1.5rem;">🛒</span>
    <span class="basket-count" id="cart-badge">0</span>
</div>

<!-- The Basket Popup -->
<div id="basketModal">
    <div class="basket-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0;">Your Basket</h2>
            <span onclick="toggleBasket()" style="cursor:pointer; font-size:2rem;">&times;</span>
        </div>
        
        <div id="basketList" class="basket-items-list">
            <!-- Items will appear here -->
        </div>

        <div style="border-top: 2px solid #374151; padding-top:15px;">
            <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:bold; margin-bottom:15px;">
                <span>Total:</span>
                <span>RM <span id="cart-total">0.00</span></span>
            </div>
            <button class="checkout-btn" onclick="sendToWhatsApp()" style="width:100%;">Confirm & Order via WhatsApp</button>
            <button onclick="clearBasket()" style="background:none; border:none; color:#9ca3af; width:100%; margin-top:10px; text-decoration:underline; cursor:pointer;">Clear All</button>
        </div>
    </div>
</div>

    <!-- 1. Firebase SDKs -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
        authDomain: "jtautoservices-metadata.firebaseapp.com",
        databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jtautoservices-metadata",
        storageBucket: "jtautoservices-metadata.firebasestorage.app",
        messagingSenderId: "426427161628",
        appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- GLOBAL VARIABLES ---
    window.basket = {}; // New format: { "id": {name, price, qty, img} }
    window.allProducts = [];

    // 2. REAL-TIME DATA LISTENER
    onValue(ref(db, 'products'), (snapshot) => {
        const data = snapshot.val();
        window.allProducts = []; 
        if (data) {
            for (let id in data) { window.allProducts.push(data[id]); }
        }
        window.renderMarket();
        window.setLanguage(localStorage.getItem('preferredLang') || 'en');
    });

    // --- MARKET RENDERING ---
    window.renderMarket = function() {
        document.querySelectorAll('.market-grid').forEach(grid => grid.innerHTML = '');

        window.allProducts.forEach(item => {
            const section = document.getElementById(item.category);
            if (!section) return;
            const grid = section.querySelector('.market-grid');
            
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-name', (item.name_en + " " + (item.brand || "")).toLowerCase());
            
            card.innerHTML = `
                <div onclick="openPopup('${item.id}')" style="cursor:pointer">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                        <span class="brand-label">${item.brand || ''}</span>
                        <span class="fit-badge">${item.badge || 'Genuine'}</span>
                    </div>
                    <img src="${item.main_img || 'assets/no-image.png'}">
                    <h4 style="margin:5px 0; font-size:0.85rem; height:35px; overflow:hidden;">${item.name_en}</h4>
                    <span class="price">RM ${parseFloat(item.price).toFixed(2)}</span>
                </div>
                <button onclick="addToCart('${item.id}')" style="background:var(--primary-color); color:white; border:none; width:100%; padding:10px; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px;">
                    + Add to Basket
                </button>
            `;
            grid.appendChild(card);
        });
    };

    // --- NEW BASKET LOGIC ---
    window.toggleBasket = function() {
        const modal = document.getElementById('basketModal');
        modal.style.display = (modal.style.display === "block") ? "none" : "block";
        if(modal.style.display === "block") window.renderBasketItems();
    };

    window.addToCart = function(id) {
        const item = window.allProducts.find(p => p.id === id);
        if (!window.basket[id]) {
            window.basket[id] = { 
                name: item.name_en, 
                price: parseFloat(item.price), 
                qty: 1, 
                img: item.main_img 
            };
        } else {
            window.basket[id].qty += 1;
        }
        window.updateBasketUI();
        
        // Button Feedback
        const fab = document.querySelector('.basket-fab');
        fab.style.transform = "scale(1.2)";
        setTimeout(() => fab.style.transform = "scale(1)", 200);
    };

    window.updateQty = function(id, delta) {
        if (window.basket[id]) {
            window.basket[id].qty += delta;
            if (window.basket[id].qty <= 0) delete window.basket[id];
        }
        window.updateBasketUI();
        window.renderBasketItems();
    };

    window.removeFromCart = function(id) {
        delete window.basket[id];
        window.updateBasketUI();
        window.renderBasketItems();
    };

    window.updateBasketUI = function() {
        let count = 0;
        let total = 0;
        for (let id in window.basket) {
            count += window.basket[id].qty;
            total += window.basket[id].qty * window.basket[id].price;
        }
        document.getElementById('cart-badge').innerText = count;
        document.getElementById('cart-total').innerText = total.toFixed(2);
    };

    window.renderBasketItems = function() {
        const container = document.getElementById('basketList');
        container.innerHTML = "";
        
        if (Object.keys(window.basket).length === 0) {
            container.innerHTML = "<p style='text-align:center; padding:20px; color:#9ca3af;'>Your basket is empty.</p>";
            return;
        }

        for (let id in window.basket) {
            const item = window.basket[id];
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:5px;">
                <div style="flex-grow:1; margin-left:10px;">
                    <h4 style="margin:0; font-size:0.9rem;">${item.name}</h4>
                    <p style="margin:0; color:var(--primary-color); font-weight:bold;">RM ${item.price.toFixed(2)}</p>
                    <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                        <button onclick="updateQty('${id}', -1)" style="width:25px; height:25px; cursor:pointer;">-</button>
                        <span>${item.qty}</span>
                        <button onclick="updateQty('${id}', 1)" style="width:25px; height:25px; cursor:pointer;">+</button>
                    </div>
                </div>
                <span onclick="removeFromCart('${id}')" style="color:#ff4444; cursor:pointer; font-size:1.2rem;">🗑️</span>
            `;
            container.appendChild(div);
        }
    };

    window.clearBasket = function() {
        if(confirm("Clear your entire basket?")) {
            window.basket = {};
            window.updateBasketUI();
            window.toggleBasket();
        }
    };

    // --- WHATSAPP ORDER ---
    window.sendToWhatsApp = function() {
        let total = document.getElementById('cart-total').innerText;
        if (total === "0.00") return alert("Your basket is empty!");
        
        let msg = "*🛒 NEW ORDER - JTS MARKET*%0A--------------------------%0A";
        for (let id in window.basket) {
            const item = window.basket[id];
            msg += `• ${item.name} (x${item.qty}) - RM ${(item.qty * item.price).toFixed(2)}%0A`;
        }
        msg += `--------------------------%0A*TOTAL: RM ${total}*`;
        window.open(`https://wa.me/60165250890?text=${msg}`, '_blank');
    };

    // --- EXISTING MODAL & SEARCH ---
    window.openPopup = function(id) {
        const item = window.allProducts.find(p => p.id === id);
        const container = document.getElementById('modalDetails');
        container.innerHTML = `
            <h2 style="color:var(--primary-color);">${item.name_en}</h2>
            <div class="modal-gallery"><img src="${item.main_img}" style="width:100%; border-radius:10px;"></div>
            <p>${item.desc_en || ''}</p>
            <button onclick="addToCart('${item.id}'); closePopup();" style="background:#25d366; color:white; border:none; padding:12px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer;">
                Add to Basket & Continue Shopping
            </button>
        `;
        document.getElementById('productModal').style.display = "block";
    };

    window.closePopup = function() { document.getElementById('productModal').style.display = "none"; };

    window.filterProducts = function() {
        let term = document.getElementById('productSearch').value.toLowerCase();
        document.querySelectorAll('.product-card').forEach(card => {
            card.style.display = card.getAttribute('data-name').includes(term) ? "" : "none";
        });
    };

    window.setLanguage = function(lang) {
        document.querySelectorAll('[data-en]').forEach(el => {
            el.innerText = el.getAttribute('data-' + lang);
        });
        localStorage.setItem('preferredLang', lang);
    };
</script>
</body>
</html>
