<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTS Corporate Login</title>
    <style>
        /* Modern Dark Theme Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Deep charcoal background */
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #1e1e1e; /* Slightly lighter card background */
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #333;
        }

        /* Logo Styling */
        .company-logo {
            width: 220px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 1.5rem;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img src="Data/images/logo.png" alt="Company Logo" class="company-logo">
    
    <h2>JTS Admin Tools</h2>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Access System</button>
    </form>
    
    <p id="message"></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Demonstration Logic
        if (user === "admin" && pass === "020422") {
            window.location.href = "main.html"; 
        } else {
            document.getElementById('message').innerText = "Access Denied. Check credentials.";
        }
    });
</script>

</body>
</html>
