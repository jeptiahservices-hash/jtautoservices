<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTS Corporate Login</title>
    <style>
        /* Modern Dark Theme Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Deep charcoal background */
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #1e1e1e; /* Slightly lighter card background */
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #333;
        }

        /* Logo Styling */
        .company-logo {
            width: 220px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 1.5rem;
            object-fit: contain;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- YOUR ORIGINAL BRANDING LOGO -->
    <img src="Data/images/logo.png" alt="Company Logo" class="company-logo" onerror="this.src='images/logow.png'">
    
    <h2>JTS Admin Tools</h2>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Access System</button>
    </form>
    
    <p id="message"></p>
</div>

<!-- SECURE FIREBASE ENGINE LOGIC -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
        authDomain: "jtautoservices-metadata.firebaseapp.com",
        databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jtautoservices-metadata",
        storageBucket: "jtautoservices-metadata.firebasestorage.app",
        messagingSenderId: "426427161628",
        appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const msgElement = document.getElementById('message');

        msgElement.style.color = "#58a6ff";
        msgElement.innerText = "Connecting to secure database nodes...";

        // Map 'admin' shortcut to your chosen master email address
        let resolvedEmail = user;
        if (user === "admin") {
            resolvedEmail = "jepsipemalas@gmail.com"; 
        }

        // Set local device persistence so you only have to log in once
        setPersistence(auth, browserLocalPersistence)
            .then(() => {
                return signInWithEmailAndPassword(auth, resolvedEmail, pass);
            })
            .then((userCredential) => {
                msgElement.style.color = "#2ea44f";
                msgElement.innerText = "✓ Access Granted! Redirecting to dashboard...";
                
                setTimeout(() => {
                    window.location.href = "main.html"; 
                }, 800);
            })
            .catch((error) => {
                console.error(error);
                msgElement.style.color = "#ff6b6b";
                
                if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found") {
                    msgElement.innerText = "Access Denied. Check credentials.";
                } else {
                    msgElement.innerText = "System Error: " + error.message;
                }
            });
    });
</script>

</body>
</html>
