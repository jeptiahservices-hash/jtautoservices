<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JT Auto Services | Admin Booking Board</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --danger: #dc2626;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--dark);
            color: var(--text);
            margin: 0; padding: 20px;
        }
        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 30px;}
        
        /* --- ADMIN AUTH BANNER UI --- */
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }
        .auth-card input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #111827;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .admin-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* --- DASHBOARD CONTROLS --- */
        #adminDashboard { display: none; }
        
        .timeline-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 15px 5px;
            margin-bottom: 30px;
            background: #111827;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .timeline-card {
            background: var(--surface);
            border-left: 4px solid var(--primary);
            padding: 15px;
            min-width: 260px;
            border-radius: 6px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .time-badge {
            background: var(--primary);
            padding: 3px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background: #111827; color: var(--primary); font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .status-select {
            background: #111827;
            color: white;
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 4px;
        }
        .map-btn {
            background: #4285F4;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- --- AUTH SCREEN BLOCK --- -->
    <div id="authContainer" class="auth-card">
        <h3 style="margin-top:0; color: var(--primary);">Secure Admin Gate</h3>
        <p style="font-size:0.9rem; color:#9ca3af;">Please sign in to read secure booking nodes.</p>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Admin Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit" class="admin-btn">Log In</button>
        </form>
    </div>

    <!-- --- SECURE PANEL INTERFACE --- -->
    <div id="adminDashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 30px; padding-bottom: 10px;">
            <h2 style="border:none; margin:0; padding:0;">🛠️ JT Auto Booking Manager Panel</h2>
            <button class="logout-btn" id="logoutBtn">Secure Log Out</button>
        </div>

        <h3 style="color:#9ca3af;">📅 Upcoming Timeline Schedule</h3>
        <div class="timeline-container" id="timelineView"></div>

        <h3 style="color:#9ca3af; margin-top:40px;">📋 All Service Requests</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Customer / Vehicle</th>
                        <th>Date & Time</th>
                        <th>Location Mode</th>
                        <th>Issues / Problems</th>
                        <th>Manage Status</th>
                    </tr>
                </thead>
                <tbody id="tableDetailsBody"></tbody>
            </table>
        </div>
    </div>

    <!-- --- COMPREHENSIVE MODULAR DRIVER --- -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        // Imported Authentication module to unlock read capabilities securely
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
            authDomain: "jtautoservices-metadata.firebaseapp.com",
            databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "jtautoservices-metadata",
            storageBucket: "jtautoservices-metadata.firebasestorage.app",
            messagingSenderId: "426427161628",
            appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);
        
        let activeBookingsListener = null;

        // Monitoring Session Status Flow
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Admin valid: Reveal Dashboard, Hide Login form
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                startDatabaseSync();
            } else {
                // Admin invalid: Lock UI, Show Login form
                document.getElementById('authContainer').style.display = 'block';
                document.getElementById('adminDashboard').style.display = 'none';
                cleanUiViews();
            }
        });

        // Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            signInWithEmailAndPassword(auth, email, pass)
                .catch(err => alert("Access Denied: " + err.message));
        });

        // Handle Logout Action
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });

        // Synchronize Active Bookings Tree
        function startDatabaseSync() {
            const bookingsRef = ref(database, 'bookings');
            activeBookingsListener = onValue(bookingsRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('timelineView').innerHTML = '<p style="padding:15px; color:#6b7280;">No entries scheduled.</p>';
                    document.getElementById('tableDetailsBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#6b7280;">Empty database records.</td></tr>';
                    return;
                }

                const bookingsList = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                bookingsList.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

                renderTimeline(bookingsList);
                renderTableDetails(bookingsList);
            }, (error) => {
                console.error("Database Read Blocked: ", error);
            });
        }

        function cleanUiViews() {
            document.getElementById('timelineView').innerHTML = '';
            document.getElementById('tableDetailsBody').innerHTML = '';
        }

        function renderTimeline(bookings) {
            const container = document.getElementById('timelineView');
            container.innerHTML = '';
            const activeJobs = bookings.filter(b => b.status !== 'Completed' && b.status !== 'Cancelled');

            if(activeJobs.length === 0) {
                container.innerHTML = '<p style="padding:15px; color:#6b7280;">No active jobs in pipeline.</p>';
                return;
            }

            activeJobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'timeline-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span class="time-badge">${job.time}</span>
                        <strong style="color:#9ca3af; font-size:0.85rem;">${formatDisplayDate(job.date)}</strong>
                    </div>
                    <div style="font-weight:bold; font-size:1.05rem;">${job.carModel} (${job.plateNumber})</div>
                    <div style="font-size:0.9rem; color:#cbd5e1; margin-top:5px;">👤 ${job.name}</div>
                    <div style="font-size:0.85rem; color:#9ca3af; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📍 Problem: ${job.problems}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderTableDetails(bookings) {
            const tbody = document.getElementById('tableDetailsBody');
            tbody.innerHTML = '';

            bookings.forEach(job => {
                const tr = document.createElement('tr');
                const locAction = job.locationType === 'DoorToDoor' 
                    ? `<a href="${job.locationUrl}" target="_blank" class="map-btn">🗺️ Open Map</a>` 
                    : `<span>🏭 Workshop</span>`;

                tr.innerHTML = `
                    <td>
                        <strong>${job.name}</strong><br>
                        <span style="font-size:0.85rem; color:#9ca3af;">📞 ${job.phone} | 🚗 ${job.carModel} [${job.plateNumber}]</span>
                    </td>
                    <td><strong>${job.date}</strong><br><span style="color:#38bdf8;">🕒 ${job.time}</span></td>
                    <td>${locAction}</td>
                    <td style="max-width:250px; font-size:0.9rem; color:#cbd5e1;">${job.problems}</td>
                    <td>
                        <select class="status-select" onchange="updateJobStatus('${job.id}', this.value)">
                            <option value="Pending" ${job.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Confirmed" ${job.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Completed" ${job.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Cancelled" ${job.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.updateJobStatus = function(id, newStatus) {
            const statusUpdate = {};
            statusUpdate[`/bookings/${id}/status`] = newStatus;
            update(ref(database), statusUpdate)
                .then(() => alert(`Status altered to: ${newStatus}`))
                .catch(err => alert("Error updating entry: " + err));
        };

        function formatDisplayDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
