<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JTS | Order Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; padding: 20px; }
        .order-card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 6px solid #2563eb; position: relative; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .status-new { background: #fbbf24; color: #000; padding: 4px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .order-time { font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px; }
        .item-list { margin: 15px 0; padding-left: 20px; color: #e2e8f0; line-height: 1.6; }
        .total-price { font-size: 1.25rem; font-weight: bold; color: #60a5fa; border-top: 1px solid #334155; pt: 10px; margin-top: 10px; }
        .delete-btn { position: absolute; top: 20px; right: 20px; background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        #orders-container { max-width: 800px; margin: 0 auto; }
        .error-box { background: #450a0a; border: 1px solid #f87171; color: #f87171; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 style="margin: 0;">📋 Customer Orders</h1>
        <button onclick="location.reload()" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;">🔄 Refresh</button>
    </div>

    <div id="orders-container">
        <p id="loading-text" style="text-align: center; color: #9ca3af; font-size: 1.2rem;">Initializing System...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
            authDomain: "jtautoservices-metadata.firebaseapp.com",
            databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "jtautoservices-metadata",
            storageBucket: "jtautoservices-metadata.firebasestorage.app",
            messagingSenderId: "426427161628",
            appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const auth = getAuth(app);
            const container = document.getElementById('orders-container');
            const loadingText = document.getElementById('loading-text');

            // 1. SILENT LOGIN
            signInWithEmailAndPassword(auth, "admin@jts.com", "02042022")
                .then(() => {
                    loadingText.innerText = "Access Granted. Fetching orders...";
                })
                .catch((error) => {
                    container.innerHTML = `<div class="error-box"><strong>Auth Error:</strong> ${error.message}<br>Check if user <b>admin@jts.com</b> exists in Firebase.</div>`;
                });

            // 2. LISTEN FOR AUTH CHANGE
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const ordersRef = ref(db, 'orders');
                    onValue(ordersRef, (snapshot) => {
                        const data = snapshot.val();
                        
                        if (!data) {
                            container.innerHTML = "<p style='text-align:center; color:#9ca3af;'>No orders found in database.</p>";
                            return;
                        }

                        container.innerHTML = "";
                        const sortedIds = Object.keys(data).reverse();

                        sortedIds.forEach(id => {
                            const order = data[id];
                            const date = new Date(order.timestamp).toLocaleString('en-MY');
                            
                            let itemsHtml = "";
                            for (let key in order.items) {
                                const item = order.items[key];
                                itemsHtml += `<li>${item.name} <strong>(x${item.qty})</strong></li>`;
                            }

                            container.innerHTML += `
                                <div class="order-card">
                                    <button class="delete-btn" onclick="deleteOrder('${id}')">🗑️ Delete</button>
                                    <div class="order-time">${date}</div>
                                    <span class="status-new">${order.status || 'NEW'}</span>
                                    <ul class="item-list">${itemsHtml}</ul>
                                    <div class="total-price">Total: RM ${order.totalAmount}</div>
                                </div>
                            `;
                        });
                    }, (error) => {
                        container.innerHTML = `<div class="error-box"><strong>Database Error:</strong> ${error.message}<br>Check your Firebase Security Rules.</div>`;
                    });
                }
            });

            // 3. DELETE FUNCTION
            window.deleteOrder = function(id) {
                if(confirm("Permanently delete this order record?")) {
                    remove(ref(db, 'orders/' + id))
                        .catch(err => alert("Error: " + err));
                }
            };

        } catch (globalError) {
            document.body.innerHTML = `<div class="error-box"><strong>Critical Error:</strong> ${globalError.message}</div>`;
        }
    </script>
</body>
</html>
