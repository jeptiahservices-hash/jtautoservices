<script type="module">
    // 1. Import all necessary Firebase tools
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 2. Your Firebase Configuration (Keep this exactly as it is)
    const firebaseConfig = {
        apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
        authDomain: "jtautoservices-metadata.firebaseapp.com",
        databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jtautoservices-metadata",
        storageBucket: "jtautoservices-metadata.firebasestorage.app",
        messagingSenderId: "426427161628",
        appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // 4. Silent Login - This runs as soon as the page opens
    signInWithEmailAndPassword(auth, "admin@jts.com", "02042022")
        .then(() => console.log("Login signal sent..."))
        .catch(err => {
            document.getElementById('orders-container').innerHTML = "Login Error: " + err.message;
        });

    // 5. SECURITY CHECK: Wait for Login to be confirmed by Firebase
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // ONLY once logged in, we start looking for orders
            console.log("Database Unlocked. Loading orders now...");
            startOrderListener();
        } else {
            document.getElementById('orders-container').innerHTML = "Authenticating with Firebase...";
        }
    });

    // 6. The actual function to pull orders
    function startOrderListener() {
        const ordersRef = ref(db, 'orders');
        
        onValue(ordersRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('orders-container');
            
            if (!data) {
                container.innerHTML = "<p style='text-align:center;'>No orders found in the database.</p>";
                return;
            }

            container.innerHTML = "";
            // Reverse the keys so the newest order is at the top
            const sortedIds = Object.keys(data).reverse();

            sortedIds.forEach(id => {
                const order = data[id];
                const date = new Date(order.timestamp).toLocaleString('en-MY'); // Malaysian Time Format
                
                let itemsHtml = "";
                for (let key in order.items) {
                    const item = order.items[key];
                    itemsHtml += `<li>${item.name} <strong>(x${item.qty})</strong></li>`;
                }

                container.innerHTML += `
                    <div class="order-card">
                        <button class="delete-btn" onclick="deleteOrder('${id}')">🗑️ Delete Order</button>
                        <div class="order-time">${date}</div>
                        <span class="status-new">STATUS: ${order.status || 'NEW'}</span>
                        <ul style="margin: 15px 0; padding-left: 20px;">${itemsHtml}</ul>
                        <div style="font-weight:bold; font-size:1.1rem; color:#60a5fa;">Total Amount: RM ${order.totalAmount}</div>
                    </div>
                `;
            });
        });
    }

    // 7. Delete Function
    window.deleteOrder = function(id) {
        if(confirm("Are you sure you want to delete this order record?")) {
            remove(ref(db, 'orders/' + id))
                .then(() => console.log("Order deleted."))
                .catch(err => alert("Error deleting: " + err));
        }
    };
</script>
