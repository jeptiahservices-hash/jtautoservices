<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JT Auto Services - Dashboard</title>
    <style>
        /* Core Dark Theme */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        
        /* Header Styling */
        header {
            background-color: #1e1e1e; /* Matching the login card color */
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        
        .logo-container { display: flex; align-items: center; }
        .logo-container img { height: 50px; margin-right: 15px; }
        .company-name { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .contact-info { font-size: 14px; color: #b0b0b0; }

        /* Navigation Styling */
        nav { 
            background: #181818; 
            padding: 12px; 
            text-align: center; 
            border-bottom: 1px solid #333;
        }

        /* Dark Theme Button Styling */
        nav button { 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        nav button:hover { 
            background-color: #007bff; /* Corporate blue from login page */
            color: white;
            border-color: #007bff;
        }

        nav button:active {
            transform: translateY(2px);
        }

        /* Frame Container Styling */
        iframe { 
            border: none; 
            background-color: #121212; /* Keeps the iframe area dark while loading */
            display: block;
        }

        /* Logout Link Styling */
        .logout-link {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            border: 1px solid #ff6b6b;
            padding: 5px 12px;
            border-radius: 4px;
        }
        .logout-link:hover {
            background: #ff6b6b;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Data/images/logo.png" alt="JT Auto Services Logo"> 
            <div class="company-name">JT Auto Services</div>
        </div>
        <div class="contact-info">
            Contact: (+60) 16-5250890
            <a href="login.html" class="logout-link">Logout</a>
        </div>
    </header>

    <nav>
        <button onclick="changePage('Data/pages/billgen.html')">Bill Generator</button>
        <button onclick="changePage('Data/pages/worksumery.html')">Work Report</button>
        <button onclick="changePage('Data/pages/records.html')">$ Records</button>
        <button onclick="changePage('Data/pages/oders.html')">Customer Oder</button>
        <button onclick="changePage('Data/pages/market-admin.html')">Market Admin</button>
        <button onclick="changePage('Data/pages/mycar-admin.html')">MyCar Admin</button>
        <button onclick="changePage('Data/pages/about.html')">About Us</button>
    </nav>

    <iframe id="main-view" src="Data/images/service.png" width="100%" height="1500px"></iframe>

    <script>
        // Smoothly change the iframe source
        function changePage(pageUrl) {
            document.getElementById('main-view').src = pageUrl;
        }
    </script>

</body>
</html>
