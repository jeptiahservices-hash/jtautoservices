<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JT Auto Services - Dashboard</title>
    <style>
        /* Core Dark Theme */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        
        /* Header Styling */
        header {
            background-color: #1e1e1e; /* Matching the login card color */
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        
        .logo-container { display: flex; align-items: center; }
        .logo-container img { height: 50px; margin-right: 15px; }
        .company-name { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .contact-info { font-size: 14px; color: #b0b0b0; display: flex; align-items: center; gap: 15px; }

        /* Navigation Styling */
        nav { 
            background: #181818; 
            padding: 12px; 
            text-align: center; 
            border-bottom: 1px solid #333;
        }

        /* Dark Theme Button Styling */
        nav button { 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        nav button:hover, nav button.active { 
            background-color: #007bff; /* Corporate blue from login page */
            color: white;
            border-color: #007bff;
        }

        nav button:active {
            transform: translateY(2px);
        }

        /* Frame Container Styling */
        iframe { 
            border: none; 
            background-color: #121212; /* Keeps the iframe area dark while loading */
            display: block;
        }

        /* Logout Link Styling */
        .logout-link {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #ff6b6b;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
            font-weight: bold;
        }
        .logout-link:hover {
            background: #ff6b6b;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Data/images/logo.png" alt="JT Auto Services Logo" onerror="this.src='images/logow.png'"> 
            <div class="company-name">JT Auto Services</div>
        </div>
        <div class="contact-info">
            Contact: (+60) 16-5250890
            <!-- Changed to an actual clickable trigger button for true Firebase session logout -->
            <button id="logoutBtn" class="logout-link">Logout</button>
        </div>
    </header>

    <nav id="navBarTabs">
        <!-- UPDATED: Pointing to your optimized Admin Pro and Analytics files -->
        <button class="active" onclick="changePage('Data/pages/billgen.html', this)">🛠️ JTS Admin Pro</button>
        <button onclick="changePage('analytics.html', this)">📈 Boss Analytics</button>
        <button onclick="changePage('viewer.html', this)">🚙 Customer Viewer</button>
        
        <!-- Keeping your placeholders -->
        <button onclick="changePage('Data/pages/oders.html', this)">Customer Order</button>
        <button onclick="changePage('Data/pages/market-admin.html', this)">Market Admin</button>
        <button onclick="changePage('Data/pages/mycar-admin.html', this)">MyCar Admin</button>
        <button onclick="changePage('Data/pages/about.html', this)">About Us</button>
    </nav>

    <!-- Switched default landing preview src to admin-pro.html so it loads up instantly -->
    <iframe id="main-view" src="admin-pro.html" width="100%" height="1500px"></iframe>

    <!-- FIREBASE AND FRAME RUNTIME MANAGER ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOkSn53iUrBiHO-5wS1t4vcJwW46yAoqs",
            authDomain: "jtautoservices-metadata.firebaseapp.com",
            databaseURL: "https://jtautoservices-metadata-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "jtautoservices-metadata",
            storageBucket: "jtautoservices-metadata.firebasestorage.app",
            messagingSenderId: "426427161628",
            appId: "1:426427161628:web:22a0f220400cfc5c1a93d9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. Live Authenticated Session Observer Gatekeeper
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                console.log("No active user session key found. Shielding layout access...");
                window.location.href = "login.html"; // Kicks back to login page if unauthenticated
            } else {
                console.log("Secure access cleared for supervisor:", user.email);
            }
        });

        // 2. Clear Session Token on Logout Trigger click
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch(err => alert("Logout Exception: " + err.message));
        });

        // 3. Page Switching Routine with dynamic active tab indicator highlighting
        window.changePage = function(pageUrl, currentButton) {
            document.getElementById('main-view').src = pageUrl;
            
            if (currentButton) {
                const buttons = document.querySelectorAll('#navBarTabs button');
                buttons.forEach(btn => btn.classList.remove('active'));
                currentButton.classList.add('active');
            }
        };
    </script>

</body>
</html>
