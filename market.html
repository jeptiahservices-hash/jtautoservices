<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTS Market | Genuine Parts</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --dark-bg: #111827;
            --card-bg: #1f2937;
            --text-light: #f3f4f6;
            --accent-gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* --- HEADER & HERO --- */
        header {
            background: rgba(17, 24, 39, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-color);
        }
        .logo-container img { height: 120px; vertical-align: middle; }
        .logo-text { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .lang-switch button {
            background: transparent; border: 1px solid #444; color: white;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
        }

        .hero {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('images/img_hero_wallpaper.jpeg');
            background-size: cover;
            background-position: center;
        }

        /* --- SEARCH & NAV --- */
        .search-container {
            padding: 20px 5%;
            position: sticky;
            top: 70px;
            background: var(--dark-bg);
            z-index: 900;
        }
        #productSearch {
            width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #333;
            background: var(--card-bg); color: white; font-size: 1rem; box-sizing: border-box;
        }

        .category-nav {
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 5%;
            background: #1a222f; position: sticky; top: 135px; z-index: 850; border-bottom: 1px solid #333;
        }
        .category-nav a {
            background: var(--card-bg); color: white; padding: 8px 15px; border-radius: 20px;
            text-decoration: none; white-space: nowrap; font-size: 0.8rem; border: 1px solid #444;
        }

        /* --- MARKET GRID --- */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .market-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .market-grid { grid-template-columns: repeat(2, 1fr); } }

        .product-card {
            background: var(--card-bg); border-radius: 12px; padding: 15px;
            text-align: center; border: 1px solid #333; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--primary-color); }
        .product-card img { width: 100%; height: 120px; object-fit: contain; margin-bottom: 10px; }
        .brand-label { font-size: 0.6rem; color: var(--primary-color); font-weight: 800; text-transform: uppercase; }
        .fit-badge { font-size: 0.6rem; background: #374151; color: var(--accent-gold); padding: 2px 6px; border-radius: 4px; }
        .price { color: var(--primary-color); font-weight: bold; display: block; margin: 10px 0; }

        /* --- MODAL POPUP --- */
        .modal {
            display: none; position: fixed; z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); margin: 5% auto; padding: 20px;
            width: 90%; max-width: 500px; border-radius: 15px;
            border: 1px solid var(--primary-color); position: relative;
            max-height: 80vh; overflow-y: auto;
        }
        .close-modal { position: absolute; right: 20px; top: 10px; font-size: 30px; cursor: pointer; color: #ff4444; }
        .modal-gallery { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; padding-bottom: 10px; }
        .modal-gallery img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #444; flex-shrink: 0; }

        /* --- BASKET & BUTTONS --- */
        .qty-controls { display: flex; justify-content: center; align-items: center; gap: 10px; background: #111827; border-radius: 6px; padding: 5px; }
        .qty-btn { background: var(--primary-color); color: white; border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; }
        .qty-input { width: 30px; text-align: center; background: transparent; color: white; border: none; font-weight: bold; }
        
        .basket-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-top: 3px solid var(--primary-color); z-index: 2000;
        }
        .checkout-btn { background: #25d366; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }

        .shopee-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #ee4d2d; /* Shopee's official orange */
    color: white !important;
    padding: 12px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 20px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    border: none;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.shopee-btn:hover {
    background-color: #ff5722;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}

.shopee-btn:active {
    transform: translateY(0);
}
        @keyframes pulse-orange {
    0% { box-shadow: 0 0 0 0 rgba(238, 77, 45, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(238, 77, 45, 0); }
    100% { box-shadow: 0 0 0 0 rgba(238, 77, 45, 0); }
}

.shopee-btn {
    animation: pulse-orange 2s infinite;
}
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
            <span class="logo-text">Mar<span style="color:var(--primary-color)">ket</span></span>
        </div>
        <div class="nav-right">
            <div class="lang-switch">
                <button onclick="setLanguage('en')">EN</button>
                <button onclick="setLanguage('bm')">BM</button>
            </div>
            <a href="index.html" class="logo-text" style="font-size: 0.7rem; border-left: 1px solid #333; padding-left: 10px;">HOME</a>
        </div>
    </header>

    <section class="hero">
        <h1 data-en="Shop Parts" data-bm="Kedai Alat Ganti">Shop Parts</h1>
        <p data-en="Select items and checkout via WhatsApp" data-bm="Pilih barang dan pesan melalui WhatsApp">Select items and checkout via WhatsApp</p>
    </section>

    <div class="search-container">
        <input type="text" id="productSearch" onkeyup="filterProducts()" placeholder="Search model or part...">
    </div>

    <div class="category-nav">
        <a href="#oil-section">🛢️ Engine Oil</a>
        <a href="#filter-section">🌪️ Oil Filters</a>
        <a href="#bulb-section">💡 Bulbs</a>
    </div>

    <div id="market-content" style="padding: 20px 5%;">
        <div id="oil-section" style="margin-bottom: 40px;">
            <h3 style="border-left: 4px solid var(--primary-color); padding-left: 10px;" data-en="Engine Oil" data-bm="Minyak Enjin">Engine Oil</h3>
            <div class="market-grid"></div> 
        </div>

        <div id="filter-section" style="margin-bottom: 40px;">
            <h3 style="border-left: 4px solid var(--primary-color); padding-left: 10px;" data-en="Oil Filters" data-bm="Penapis Minyak">Oil Filters</h3>
            <div class="market-grid"></div>
        </div>

        <div id="bulb-section" style="margin-bottom: 40px;">
            <h3 style="border-left: 4px solid var(--primary-color); padding-left: 10px;" data-en="Bulbs & Lights" data-bm="Lampu & Mentol">Bulbs & Lights</h3>
            <div class="market-grid"></div>
        </div>
    </div>

    <div class="basket-bar">
        <div>
            <button onclick="clearBasket()" style="background:none; color:#ff4444; border:none; font-size:0.7rem; text-decoration:underline; cursor:pointer;">CLEAR ITEMS</button>
            <div class="total-amount">RM <span id="total-price">0</span></div>
        </div>
        <button class="checkout-btn" onclick="sendToWhatsApp()" data-en="Order Now" data-bm="Buat Pesanan">Order Now</button>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePopup()">&times;</span>
            <div id="modalDetails"></div>
        </div>
    </div>

    <script>
        let basket = {};
        let allProducts = [];

        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                renderMarket();
            } catch (e) { console.error("Could not load products.json", e); }
        }

        function renderMarket() {
            allProducts.forEach(item => {
                const section = document.getElementById(item.category);
                if (!section) return;
                const grid = section.querySelector('.market-grid');
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-name', (item.name_en + " " + item.brand + " " + item.badge).toLowerCase());
                
                card.innerHTML = `
                    <div onclick="openPopup('${item.id}')" style="cursor:pointer">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                            <span class="brand-label">${item.brand}</span>
                            <span class="fit-badge">${item.badge}</span>
                        </div>
                        <img src="${item.main_img}">
                        <h4 style="margin:5px 0; font-size:0.9rem;">${item.name_en}</h4>
                        <span class="price">RM ${item.price}</span>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty('${item.id}', -1, ${item.price})">-</button>
                        <input class="qty-input" id="qty-${item.id}" value="0" readonly>
                        <button class="qty-btn" onclick="changeQty('${item.id}', 1, ${item.price})">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openPopup(id) {
            const item = allProducts.find(p => p.id === id);
            const container = document.getElementById('modalDetails');
            container.innerHTML = `
                <h2 style="color:var(--primary-color); margin-top:10px;">${item.name_en}</h2>
                <p><strong>Brand:</strong> ${item.brand} | <strong>Grade:</strong> ${item.grade}</p>
                <div class="modal-gallery">
                    ${item.gallery.map(img => `<img src="${img}">`).join('')}
                </div>
                <p style="font-size:0.9rem;">${item.desc_en}</p>
                <p style="font-size:0.8rem; color:#9ca3af;">${item.desc_bm}</p>
                <a href="${item.shopee_link}" target="_blank" class="shopee-btn">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee Icon" style="width:18px; height:18px; margin-right:8px;">
    Buy on Shopee
</a>
            `;
            document.getElementById('productModal').style.display = "block";
        }

        function closePopup() { document.getElementById('productModal').style.display = "none"; }

        function changeQty(id, change, price) {
            const input = document.getElementById(`qty-${id}`);
            let qty = (parseInt(input.value) || 0) + change;
            if (qty < 0) qty = 0;
            input.value = qty;
            if (qty > 0) basket[id] = { qty, price }; else delete basket[id];
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            for (let id in basket) { total += basket[id].qty * basket[id].price; }
            document.getElementById('total-price').innerText = total;
        }

        function filterProducts() {
            let term = document.getElementById('productSearch').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(term) ? "" : "none";
            });
        }

        function clearBasket() {
            if(!confirm("Clear all items?")) return;
            basket = {};
            document.querySelectorAll('.qty-input').forEach(i => i.value = 0);
            updateTotal();
        }

        function sendToWhatsApp() {
            let total = document.getElementById('total-price').innerText;
            if (total === "0") return alert("Please select items first!");
            let msg = "*NEW ORDER*%0A";
            for (let id in basket) {
                const p = allProducts.find(item => item.id === id);
                msg += `• ${p.name_en} (x${basket[id].qty})%0A`;
            }
            msg += `%0A*TOTAL: RM ${total}*`;
            window.open(`https://wa.me/60165250890?text=${msg}`, '_blank');
        }

        function setLanguage(lang) {
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });
            localStorage.setItem('preferredLang', lang);
        }

        window.onload = () => {
            loadProducts();
            setLanguage(localStorage.getItem('preferredLang') || 'en');
        };
    </script>
</body>
</html>
